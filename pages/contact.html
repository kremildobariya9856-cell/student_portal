<!DOCTYPE html>
<html>

<head>
    <title>Contact Details Form</title>
    <link rel="stylesheet" href="C:\Users\Admin\OneDrive\Desktop\web_development\student_portal\css\style.css">
</head>

<body>

    <h1>Contact Details</h1>

    <form>

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="altphone">Alternate Phone Number:</label><br>
        <input type="tel" id="altphone" name="altphone"><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="website">Website:</label><br>
        <input type="url" id="website" name="website"><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30"></textarea><br><br>

        <label for="city">City:</label><br>
        <input type="text" id="city" name="city"><br><br>

        <label for="state">State:</label><br>
        <input type="text" id="state" name="state"><br><br>

        <label for="pincode">PIN Code:</label><br>
        <input type="text" id="pincode" name="pincode"><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>

</html>
