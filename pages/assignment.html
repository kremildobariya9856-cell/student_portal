<!DOCTYPE html>
<html>

<head>
    <title>Assignment Submission Form</title>
</head>

<body>

    <h1>Assignment Submission Form</h1>

    <form>

        <label for="studentname">Student Name:</label><br>
        <input type="text" id="studentname" name="studentname"><br><br>

        <label for="rollno">Roll Number:</label><br>
        <input type="text" id="rollno" name="rollno"><br><br>

        <label for="course">Course:</label><br>
        <input type="text" id="course" name="course"><br><br>

        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject"><br><br>

        <label for="faculty">Faculty Name:</label><br>
        <input type="text" id="faculty" name="faculty"><br><br>

        <label for="title">Assignment Title:</label><br>
        <input type="text" id="title" name="title"><br><br>

        <label for="submissiondate">Submission Date:</label><br>
        <input type="date" id="submissiondate" name="submissiondate"><br><br>

        <label for="file">Upload Assignment:</label><br>
        <input type="file" id="file" name="file"><br><br>

        <label for="remarks">Remarks:</label><br>
        <textarea id="remarks" name="remarks" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Submit Assignment">
        <input type="reset" value="Reset">

    </form>

</body>

</html>
